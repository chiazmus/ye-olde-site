<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravemere</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almendra:ital,wght@0,400;0,700;1,400;1,700&family=Grenze+Gotisch:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h2>Gravemere</h2>
        <p>WASD to move, mouse to look, T to activate music</p>
    </header>
    <div class="main-container">
        <main>
            <div id="fpsContainer">
                <canvas id="fps"></canvas>
                <div id="hud">
                    <div id="invDisplay">
                        <h3>Inventory</h3>
                        <ul></ul>
                    </div>
                    <div id="statContainer">
                        <div id="goldCount">Gold</div>
                        <div id="healthCount">Health</div>
                        <div id="spellCount">Spells</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <footer></footer>
    <script type="module" src="./scripts/fps.js"></script>
</body>
</html>
